spring:
  application:
    name: cinefercho

  datasource:
    url: jdbc:h2:mem:cineferchodb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: 8080

cinefercho:
  jwt:
    secret: CineferchoJwtSecretKeyForHS256AlgorithmMustBeLongEnough2026!
    expiration-ms: 86400000
    client-expiration-ms: 120000

